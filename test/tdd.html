<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Tests</title>
        <link rel="stylesheet" href="../node_modules/mocha/mocha.css"/>
    </head>
    <body>
        <h1>Tests</h1>
        <div id="mocha"></div>

        <script type="module">
        import {
          mocha,
          suite, suiteTeardown, teardown, suiteSetup, setup, test
        } from '../node_modules/mocha/mocha.mjs';
        import {expect} from '../node_modules/chai/chai.js';

        mocha.setup('tdd');

        suite('My suite (context)', function () {
          suiteTeardown(() => {
            console.log('after');
          });
          teardown(() => {
            console.log('after each');
          });
          suiteSetup(() => {
            console.log('before');
          });
          setup(() => {
            console.log('before each');
          });
          test('my test (specify)', function () {
            expect(true).to.equal(true);
          });
        });

        mocha.run();
        </script>
    </body>
</html>
